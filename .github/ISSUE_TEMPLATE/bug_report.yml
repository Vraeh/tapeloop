name: Bug report
description: Something in Tapeloop does not work as expected
labels: [bug]
body:
  - type: input
    id: tapeloop-version
    attributes:
      label: Tapeloop version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: obs-version
    attributes:
      label: OBS Studio version
      placeholder: 32.0.4
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver version
      placeholder: NVIDIA RTX 3060, driver 591.44
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a replay buffer to ...
        2. Press ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: log
    attributes:
      label: OBS log URL
      description: >-
        In OBS, Help > Log Files > Upload Current Log File, then paste the URL here.
        If OBS crashed, upload the crash report instead.
    validations:
      required: true
