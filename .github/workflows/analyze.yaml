name: Analyze
on:
  workflow_call:
permissions:
  contents: read
jobs:
  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure
        working-directory: tests
        run: cmake --preset linux-clang-tidy

      - name: Run clang-tidy
        run: |
          shopt -s globstar
          clang-tidy-18 -p build_tests/linux-clang-tidy --quiet src/core/**/*.cpp
