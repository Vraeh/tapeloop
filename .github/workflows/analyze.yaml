name: Analyze
on:
  workflow_call:
permissions:
  contents: read
jobs:
  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        working-directory: tests
        run: cmake --preset linux-clang-tidy

      - name: Run clang-tidy
        run: |
          shopt -s globstar
          clang-tidy-18 -p build_tests/linux-clang-tidy --quiet src/core/**/*.cpp
