name: Analyze
on:
  workflow_call:
permissions:
  contents: read
jobs:
  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        working-directory: tests
        run: cmake --preset linux-clang-tidy

      - name: Run clang-tidy
        run: |
          shopt -s globstar
          clang-tidy-18 -p build_tests/linux-clang-tidy --quiet src/core/**/*.cpp

      # The other checks are written for the core; the tests only share its brace rule.
      # The fuzz harnesses are not in the compile database, so their flags are given.
      - name: Check braces in the core tests and fuzz harnesses
        run: |
          shopt -s globstar
          braces=(--quiet --checks='-*,readability-braces-around-statements' --warnings-as-errors='*')
          clang-tidy-18 -p build_tests/linux-clang-tidy "${braces[@]}" --header-filter='tests/core/' \
            tests/core/**/*.cpp
          clang-tidy-18 "${braces[@]}" --header-filter='tests/fuzz/' tests/fuzz/**/*.cpp -- -std=c++20 -Isrc

      # The decoder and the OBS glue compile against libobs and the plugin's FFmpeg, so
      # their compile database comes from the libobs harness. Its job saves both caches.
      - name: Locate libobs
        run: echo "TAPELOOP_LIBOBS_PREFIX=$RUNNER_TEMP/libobs" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config extra-cmake-modules \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libx264-dev \
            libjansson-dev uthash-dev libsimde-dev zlib1g-dev uuid-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-xinput-dev libdrm-dev libgl-dev libegl-dev libglvnd-dev libwayland-dev \
            libxkbcommon-dev nasm

      - name: Restore libobs
        id: restore-libobs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TAPELOOP_LIBOBS_PREFIX }}
          key: libobs-asan-ubuntu-24.04-${{ hashFiles('buildspec.json', 'tests/obs/BuildLibobs.cmake', 'tests/obs/x264-plugin/**', '.github/workflows/run-tests.yaml') }}

      - name: Build libobs
        if: steps.restore-libobs.outputs.cache-hit != 'true'
        run: |
          cmake -DPREFIX="$TAPELOOP_LIBOBS_PREFIX" -DWORK_DIR="$RUNNER_TEMP/libobs-build" -DSANITIZE=ON \
            -P tests/obs/BuildLibobs.cmake

      - name: Read the runner image
        id: image
        run: echo "version=${ImageVersion}" >> "${GITHUB_OUTPUT}"

      - name: Restore FFmpeg
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.deps/ffmpeg-*
          key: ffmpeg-ubuntu-24.04-${{ steps.image.outputs.version }}-${{ hashFiles('cmake/ffmpeg/*.cmake') }}

      # Builds FFmpeg into .deps first when it was not restored.
      - name: Configure the libobs harness
        working-directory: tests/obs
        run: cmake --preset linux-obs-tidy

      # The Windows-only code is not in the database: SharedPictures.cpp and the _WIN32
      # parts of FFmpegDecoder.cpp.
      - name: Run clang-tidy on the decoder and the OBS glue
        run: |
          jq -r '.[].file' build_tests/linux-obs-tidy/compile_commands.json | grep -E '/src/(decode|obs)/' |
            sort -u | xargs -P "$(nproc)" -n 1 clang-tidy-18 -p build_tests/linux-obs-tidy --quiet
