name: Run Tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-gcc
            runner: ubuntu-24.04
          - preset: linux-clang-asan
            runner: ubuntu-24.04
          - preset: linux-clang-tsan
            runner: ubuntu-24.04
          - preset: windows-msvc
            runner: windows-2022
          - preset: macos
            runner: macos-15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  fuzz:
    name: linux-clang-fuzz
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake --preset linux-clang-fuzz

      - name: Build
        run: cmake --build --preset linux-clang-fuzz

      - name: Fuzz the source buffer
        run: |
          mkdir -p "$RUNNER_TEMP/corpus/source-buffer" "$RUNNER_TEMP/crashes"
          ../build_tests/linux-clang-fuzz/fuzz/source-buffer-fuzz -max_total_time=60 -timeout=10 \
            -artifact_prefix="$RUNNER_TEMP/crashes/" "$RUNNER_TEMP/corpus/source-buffer" fuzz/corpus/source-buffer

      - name: Fuzz the playhead
        run: |
          mkdir -p "$RUNNER_TEMP/corpus/playhead" "$RUNNER_TEMP/crashes"
          ../build_tests/linux-clang-fuzz/fuzz/playhead-fuzz -max_total_time=60 -timeout=10 \
            -artifact_prefix="$RUNNER_TEMP/crashes/" "$RUNNER_TEMP/corpus/playhead" fuzz/corpus/playhead

      - name: Keep the crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: ${{ runner.temp }}/crashes

  coverage:
    name: linux-clang-coverage
    runs-on: ubuntu-24.04
    env:
      BUILD: build_tests/linux-clang-coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install LLVM tools
        run: |
          if ! command -v llvm-cov-18 > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y llvm-18
          fi

      - name: Configure
        working-directory: tests
        run: cmake --preset linux-clang-coverage

      - name: Build
        working-directory: tests
        run: cmake --build --preset linux-clang-coverage

      - name: Test
        working-directory: tests
        run: ctest --preset linux-clang-coverage

      - name: Report
        run: |
          llvm-profdata-18 merge -sparse "$BUILD"/profiles/*.profraw -o "$BUILD/core.profdata"
          llvm-cov-18 report "$BUILD/tapeloop-core-tests" -instr-profile="$BUILD/core.profdata" src/core \
            > "$BUILD/report.txt"
          llvm-cov-18 show "$BUILD/tapeloop-core-tests" -instr-profile="$BUILD/core.profdata" src/core \
            -format=html -output-dir="$BUILD/html"
          {
            echo '### Coverage of src/core'
            echo '```'
            cat "$BUILD/report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: ${{ env.BUILD }}/html

      - name: Require 90% line coverage
        run: |
          set -o pipefail
          percent=$(llvm-cov-18 export -summary-only "$BUILD/tapeloop-core-tests" \
            -instr-profile="$BUILD/core.profdata" src/core | jq -e '.data[0].totals.lines.percent | numbers')
          echo "Line coverage of src/core: $percent%"
          awk -v percent="$percent" 'BEGIN { exit !(percent >= 90) }'

  obs:
    name: linux-obs
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # libobs looks for its data under the prefix it was built for, so a restored build
      # must land at the same path.
      - name: Locate libobs
        run: echo "TAPELOOP_LIBOBS_PREFIX=$RUNNER_TEMP/libobs" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config extra-cmake-modules \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libx264-dev \
            libjansson-dev uthash-dev libsimde-dev zlib1g-dev uuid-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-xinput-dev libdrm-dev libgl-dev libegl-dev libglvnd-dev libwayland-dev \
            libxkbcommon-dev xvfb xauth libgl1-mesa-dri libegl-mesa0

      - name: Restore libobs
        id: restore-libobs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TAPELOOP_LIBOBS_PREFIX }}
          key: libobs-asan-ubuntu-24.04-${{ hashFiles('buildspec.json', 'tests/obs/BuildLibobs.cmake', 'tests/obs/x264-plugin/**', '.github/workflows/run-tests.yaml') }}

      - name: Build libobs
        if: steps.restore-libobs.outputs.cache-hit != 'true'
        run: |
          cmake -DPREFIX="$TAPELOOP_LIBOBS_PREFIX" -DWORK_DIR="$RUNNER_TEMP/libobs-build" -DSANITIZE=ON \
            -P tests/obs/BuildLibobs.cmake

      - name: Save libobs
        if: steps.restore-libobs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TAPELOOP_LIBOBS_PREFIX }}
          key: ${{ steps.restore-libobs.outputs.cache-primary-key }}

      - name: Configure
        working-directory: tests/obs
        run: cmake --preset linux-obs-asan

      - name: Build
        working-directory: tests/obs
        run: cmake --build --preset linux-obs-asan

      # Xvfb resets when its last client disconnects, and a test that starts libobs again
      # right after shutting it down can find no display while it does.
      - name: Test
        working-directory: tests/obs
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24 -noreset' ctest --preset linux-obs-asan

  ui:
    name: linux-ui
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build qt6-base-dev libgl-dev libegl-dev \
            libxkbcommon-dev

      - name: Configure
        run: cmake --preset linux-ui

      - name: Build
        run: cmake --build --preset linux-ui

      - name: Test
        run: ctest --preset linux-ui
