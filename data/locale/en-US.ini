Dock.Status.Failed="Encoder failed"
Dock.Status.Waiting="Waiting for a picture"
Dock.Status.NotActivated.Tooltip="This source restarts when it becomes active, so Tapeloop does not keep it active while it is off air: that would stop the restart when it is cut to air. Its buffer fills while it plays. A media source plays off air too when it does not restart: untick the restart setting of a media source, or choose another playback behavior for a VLC source or an image slideshow."
Dock.Status.Software.Tooltip="This source is encoded on the CPU by x264, because no hardware encoder could take it. Its replays work, but it costs CPU time: it is not the optimal path."
Dock.Status.Readback.Tooltip="This source's encoder takes every frame read back through memory instead of OBS's textures: it runs on another graphics card than the one OBS renders on, or OBS has no NV12 textures to give it. Its replays work, but it costs CPU time and memory bandwidth: it is not the optimal path."
Dock.Status.Waiting.Tooltip="This source has no picture until something shows it, as display, window and game captures do. Tapeloop shows it on its own and starts its buffer as soon as it has one."
