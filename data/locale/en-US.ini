Dock.Resolution.Fixed="%1p"
Dock.StartWithOutputs="Start with streaming or recording"
Dock.ActivateOffAir="Activate selected sources that are not on air"
Dock.ActivateOffAir.Tooltip="Keeps every selected source active while its buffer runs, as if it were on air: media sources play, and other sources that only run on air start too. Media sources set to restart when they become active, and image sources, which restart an animated image, are left out, since keeping them active would stop that restart when they are cut to air. A source with audio monitoring is heard in the monitor while it is kept active. Captures do not need this: Tapeloop already shows every selected source to its buffer. The program picture and the program audio do not change."
Dock.ForceH264="Encode replays in H.264 only"
Dock.ForceH264.Tooltip="Replays are encoded in HEVC where your graphics card encodes it, which takes less memory and disk for the same picture, and in H.264 elsewhere. Tick this to use H.264 everywhere. A buffer already running keeps its encoder until it starts again."
Dock.CaptureReplay="Capture replay"
Hotkey.CaptureReplay="Tapeloop: Capture replay"
Dock.CaptureReplay.Tooltip="Keeps everything each buffer holds as a replay. The buffers keep recording."
Dock.Replays.Tooltip="The replays captured, newest first. The one selected is the one that goes on air next; a new capture selects itself."
Dock.Replay="%1, %2 sources"
Dock.Start="Start buffers"
Dock.Stop="Stop buffers"
Dock.FollowsOutputs="The buffers follow streaming and recording while either runs."
Dock.ApplyNote="Changes reach a running buffer at its next start, except activation, which applies at once."
