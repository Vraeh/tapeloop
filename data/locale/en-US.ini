Dock.Resolution="Resolution"
Dock.Resolution.Canvas="Canvas"
Dock.Resolution.Output="Output (scaled)"
Dock.Resolution.Fixed="%1p"
Dock.StartWithOutputs="Start with streaming or recording"
Dock.ActivateOffAir="Activate selected sources that are not on air"
Dock.ActivateOffAir.Tooltip="Keeps every selected source active while its buffer runs, as if it were on air, for sources that only run while they are active, as some plugins' sources do, and browser pages that wait to be told their source is active. Sources that do something when they become active are left out, since keeping them active would keep them from doing it when they are cut to air: media sources set to restart, VLC sources and image slideshows unless set to always play, browser sources set to refresh, and image sources, which restart an animated image. A source with audio monitoring is heard in the monitor while it is kept active. Captures do not need this: Tapeloop already shows every selected source to its buffer. The program picture and the program audio do not change."
Dock.Advanced="Advanced settings"
Dock.Advanced.Tooltip="Shows the settings few need: the encoder of the replays, and how it may be picked."
Dock.ReplayEncoder="Replay encoder"
Dock.ReplayEncoder.Automatic="Automatic (recommended)"
Dock.ReplayEncoder.Tooltip="The encoder replays are recorded with, apart from the one OBS streams and records with, which Tapeloop never changes. Automatic picks the encoder of the graphics card OBS renders on first, then those of other cards, then x264. Any other choice is kept even when it is not the fastest path for this computer; when it cannot start, Tapeloop goes on in the automatic order."
Dock.OtherAdapters="Allow encoders on another graphics card"
Dock.OtherAdapters.Tooltip="Lets the automatic order use the encoders of another make of graphics card than the one OBS renders on, whose frames travel through memory. Unticked, it goes from the encoders of OBS's own card straight to x264, which costs more CPU."
Dock.ForceH264="Encode replays in H.264 only"
Dock.ForceH264.Tooltip="Replays are encoded in HEVC where your graphics card encodes it, which takes less memory and disk for the same picture, and in H.264 elsewhere. Tick this to use H.264 everywhere. A buffer already running keeps its encoder until it starts again. While an encoder is chosen in the replay encoder list, that choice decides instead."
Dock.BufferMemory="Memory for buffers"
Dock.BufferMemory.Tooltip="How much memory all the buffers may hold together. Automatic sets aside a quarter of this computer's memory. When the selected sources need more for their lengths, each buffer holds less time than its length, the same part of it for all."
Dock.BufferMemory.Automatic="Automatic (%1 MiB)"
Dock.BufferMemory.AutomaticUnknown="Automatic, no limit"
Dock.BufferMemory.Unsafe="This is more than half of this computer's memory: OBS and the other programs may run short of it."
Dock.MiBSuffix=" MiB"
Dock.CaptureReplay="Capture replay"
Hotkey.CaptureReplay="Tapeloop: Capture replay"
Dock.CaptureReplay.Tooltip="Keeps everything each buffer holds as a replay, saved in the folder of this broadcast, inside a Tapeloop folder in the recording folder of OBS. The buffers keep recording."
Dock.Replays.Tooltip="The replays of every broadcast, newest first, kept on disk across restarts. The one selected is the one that goes on air next; a new capture selects itself."
Dock.Replay="%1, %2 sources"
Dock.Replay.Saving="%1, %2 sources, saving"
Dock.Replay.NotSaved="%1, %2 sources, not saved"
Dock.Replay.NotSaved.Tooltip="This replay could not be saved on disk; the OBS log says why. It plays only while the buffers still hold it."
Dock.Replay.Damaged="%1, damaged"
Dock.Replay.Damaged.Tooltip="The file of this replay is damaged, or a part of it is gone, so it cannot play."
Dock.TagFilter.All="All replays"
Dock.TagFilter.Tooltip="Shows only the replays that carry this tag."
Dock.TagName="Tag"
Dock.AddTag="Add tag"
Dock.AddTag.Tooltip="Puts this tag on the selected replay, creating it if it is new."
Dock.RemoveTag="Remove tag"
Dock.RemoveTag.Tooltip="Takes this tag off the selected replay. The other replays keep it."
Dock.DeleteTag="Delete tag"
Dock.DeleteTag.Tooltip="Takes the tag the list shows off every replay that carries it, and deletes it. The replays stay."
Dock.DeleteTag.Question="Take #%1 off every replay that carries it and delete the tag? The replays stay."
Dock.Start="Start buffers"
Dock.Stop="Stop buffers"
Dock.FollowsOutputs="The buffers follow streaming and recording while either runs."
Dock.ApplyNote="Changes reach a running buffer at its next start, except activation, which applies at once."
SourceSettings.Title="Settings for %1"
SourceSettings.OwnLength="Own buffer length"
SourceSettings.OwnResolution="Own resolution"
SourceSettings.OwnActivation="Own activation off air"
SourceSettings.Activate="Activate while not on air"
SourceSettings.Activate.Tooltip="Keeps this source active while its buffer runs, as if it were on air, unless it does something when it becomes active: a media source set to restart, a VLC source or an image slideshow not set to always play, a browser source set to refresh, or an image source. A source with audio monitoring is heard in the monitor while it is kept active. The program picture and the program audio do not change."
