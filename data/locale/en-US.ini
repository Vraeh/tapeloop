SourceSettings.OwnLength="Own buffer length"
SourceSettings.OwnResolution="Own resolution"
SourceSettings.OwnActivation="Own activation off air"
SourceSettings.Activate="Activate while not on air"
SourceSettings.Activate.Tooltip="Keeps this source active while its buffer runs, as if it were on air, unless it is a media source set to restart when it becomes active or an image source. A source with audio monitoring is heard in the monitor while it is kept active. The program picture and the program audio do not change."
