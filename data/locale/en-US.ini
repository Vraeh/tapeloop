Description="Instant replay with per-source buffers, variable speed, reverse and frame stepping."
Dock.Title="Tapeloop"
Dock.Source="Source"
Dock.Status="Buffer"
Dock.Status.Stopped="Stopped"
Dock.Status.Running="%1 s, %2 MB"
Dock.Status.Failed="Encoder failed"
Dock.Status.Waiting="Waiting for a picture"
Dock.Status.NotActivated.Tooltip="This source restarts, unpauses or refreshes when it becomes active, so Tapeloop does not keep it active while it is off air: that would keep it from doing so when it is cut to air. Its buffer fills while it plays. A media source plays off air too when its restart setting is unticked, and a VLC source when it is set to always play. A browser source or an image slideshow plays off air anyway, since Tapeloop shows it to its buffer."
Dock.Status.Software.Tooltip="This source is encoded on the CPU by x264, because no hardware encoder could take it. Its replays work, but it costs CPU time: it is not the optimal path."
Dock.Status.Readback.Tooltip="This source's encoder takes every frame read back through memory instead of OBS's textures. Its replays work, but it costs CPU time and memory bandwidth: it is not the optimal path."
Dock.Status.Readback.OtherAdapter.Tooltip="This source's encoder runs on another graphics card than the one OBS renders on, so every frame is read back through memory for it. Its replays work, but it costs CPU time and memory bandwidth: it is not the optimal path."
Dock.Status.Readback.NoTextureInput.Tooltip="This source's encoder cannot take OBS's textures, so every frame is read back through memory for it. Its replays work, but it costs CPU time and memory bandwidth: it is not the optimal path."
Dock.Status.Readback.NoTextures.Tooltip="OBS cannot hand this source's encoder its frames as textures with this graphics card or renderer, so every frame is read back through memory for it. Its replays work, but it costs CPU time and memory bandwidth: it is not the optimal path."
Dock.Status.SoftwareChosen.Tooltip="This source is encoded on the CPU by x264, the replay encoder chosen in the advanced settings. Its replays work, but it costs CPU time: it is not the optimal path."
Dock.Status.ReadbackChosen.Tooltip="This encoder is the one chosen in the advanced settings; Automatic tries the encoders of the graphics card OBS renders on first."
Dock.Status.ChoiceSkipped.Tooltip="The replay encoder chosen in the advanced settings could not start for this source, or is not available on this computer, so it is encoded by the next one in the automatic order. The OBS log says why."
Dock.Status.BudgetLimited.Tooltip="This buffer holds less than its length: the buffers together need more memory than they may use, which the advanced settings set. The seconds it shows are the ones it holds."
Dock.Status.HevcFailed.Tooltip="This source's HEVC encoder failed while it ran. When its buffer starts again, it tries the H.264 encoder of the same graphics card first, and goes on doing so until OBS closes. A buffer starts again when it is started, or when its source is unticked and ticked."
Dock.Status.HevcFallback.Tooltip="This source's HEVC encoder failed earlier, so until OBS closes it tries the H.264 encoder of the same graphics card first."
Dock.Status.Waiting.Tooltip="This source has no picture until something shows it, as display, window and game captures do. Tapeloop shows it on its own and starts its buffer as soon as it has one."
Dock.SourceSettings="Source settings..."
Dock.Length="Buffer length"
